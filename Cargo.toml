[workspace]
members = ["crates/*"]
exclude = ["docs/evidence/probes/mlua-hook"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
flux-core = { path = "crates/flux-core" }

[profile.release]
lto = "thin"
codegen-units = 1
