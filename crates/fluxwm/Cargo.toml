[package]
name = "fluxwm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
smithay = { git = "https://github.com/Smithay/smithay", rev = "023b78b1c5a05ca512767cacc07efca55fae8be4", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
flux-core.workspace = true
bitflags = "2.2.1"

flux-layout = { path = "../flux-layout" }
libc.workspace = true
calloop = { version = "=0.14.5", features = ["signals"] }
flux-ipc = { path = "../flux-ipc", features = ["calloop"] }
tempfile = "3.27"
flux-process = { path = "../flux-process" }
